quarkus.langchain4j.openai.api-key=${OPENAI_API_KEY}
quarkus.langchain4j.openai.chat-model.model-name=gpt-4o-mini
quarkus.langchain4j.openai.chat-model.temperature=0.2
quarkus.langchain4j.openai.timeout=30s

quarkus.rest-client.opensearch-memory.url=https://localhost:9200
quarkus.rest-client.opensearch-memory.tls-configuration-name=opensearch
quarkus.rest-client.opensearch-memory.connect-timeout=2000
quarkus.rest-client.opensearch-memory.read-timeout=4000
quarkus.tls.opensearch.trust-store.pem.certs=opensearch-ca.pem

opensearch.username=${OPENSEARCH_USERNAME}
opensearch.password=${OPENSEARCH_PASSWORD}
loyalty.memory.container-id=${MEMORY_CONTAINER_ID}
loyalty.memory.max-turns=10
loyalty.memory.max-preferences=5

quarkus.flyway.migrate-at-start=true
quarkus.hibernate-orm.schema-management.strategy=validate

# Keycloak Dev Services on a fixed port so the token helper keeps working
%dev.quarkus.keycloak.devservices.port=8543

# Prompts contain member data. Development only.
%dev.quarkus.langchain4j.openai.log-requests=true
%dev.quarkus.langchain4j.openai.log-responses=true
